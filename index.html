<script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.min.js"></script>
<script>
  const SCRIPT_URL = "AKfycby20Y0vvxAA_iz5Ddw7vCXea6piV8Pap_YkHUd19pFxiYxrgkDsJMWnJ9oF1RECqhCL1Q"; // Mantenha sua URL aqui!

  let activeInput = null;
  const Keyboard = window.SimpleKeyboard.default;
  const keyboard = new Keyboard({
    onChange: input => onChangeKeyboard(input),
    onKeyPress: button => onKeyPressKeyboard(button),
    layout: {
      default: [
        "1 2 3 4 5 6 7 8 9 0 {bksp}",
        "q w e r t y u i o p",
        "a s d f g h j k l",
        "z x c v b n m . @",
        "{space}"
      ]
    },
    display: {
      "{bksp}": "⌫ Apagar",
      "{space}": "Espaço"
    }
  });

  document.querySelectorAll(".input").forEach(input => {
    input.addEventListener("focus", onInputFocus);
    input.addEventListener("keyup", onInputKeyUp);
  });

  function onInputFocus(event) {
    activeInput = event.target;
    keyboard.setOptions({ inputName: event.target.id });
    keyboard.setInput(event.target.value);
  }

  function onInputKeyUp(event) {
    keyboard.setInput(event.target.value);
  }

  function onChangeKeyboard(input) {
    if (activeInput) activeInput.value = input;
  }

  function onKeyPressKeyboard(button) {}

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goToForm() {
    document.getElementById('error').innerText = '';
    document.querySelectorAll('.input').forEach(i => i.value = '');
    keyboard.clearInput();
    showPage('page-form');
  }

  function isValidCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g, '');
    if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
    let rev = 0;
    for (let i = 0; i < 9; i++) rev += parseInt(cpf.charAt(i)) * (10 - i);
    rev = 11 - (rev % 11);
    if (rev === 10 || rev === 11) rev = 0;
    if (rev !== parseInt(cpf.charAt(9))) return false;
    rev = 0;
    for (let i = 0; i < 10; i++) rev += parseInt(cpf.charAt(i)) * (11 - i);
    rev = 11 - (rev % 11);
    if (rev === 10 || rev === 11) rev = 0;
    return rev === parseInt(cpf.charAt(10));
  }

  function validateAndStart() {
    const nome = document.getElementById('input-nome').value.trim();
    const cpf = document.getElementById('input-cpf').value.trim().replace(/[^\d]/g, '');
    const email = document.getElementById('input-email').value.trim();
    const phone = document.getElementById('input-phone').value.trim();
    const err = document.getElementById('error');

    if (!nome || !cpf || !email || !phone) {
      err.innerText = 'Por favor, preencha todos os campos.';
      return;
    }

    if (!isValidCPF(cpf)) {
      err.innerText = 'CPF inválido. Verifique os números.';
      return;
    }

    const playedCPFs = JSON.parse(localStorage.getItem('played_cpfs') || '[]');
    if (playedCPFs.includes(cpf)) {
      err.innerText = 'Este CPF já realizou uma tentativa!';
      return;
    }

    window.currentUser = { nome, cpf, email, phone };
    showPage('page-wheel');
    drawWheel();
  }

  // Lista expandida para 6 fatias (visualmente mais bonita e simétrica)
  const items = [
    { label: "Agenda", color: "#f8d000", textColor: "#0b2265", weight: 5 },   
    { label: "Chaveiro", color: "#009933", textColor: "#ffffff", weight: 22.5 }, 
    { label: "Caneta", color: "#0b2265", textColor: "#ffffff", weight: 25 },
    { label: "Agenda", color: "#f8d000", textColor: "#0b2265", weight: 5 },   
    { label: "Chaveiro", color: "#009933", textColor: "#ffffff", weight: 22.5 }, 
    { label: "Caneta", color: "#0b2265", textColor: "#ffffff", weight: 25 }
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');

  function drawWheel() {
    const numSlices = items.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    ctx.clearRect(0, 0, 360, 360);

    items.forEach((item, i) => {
      const angle = i * sliceAngle;
      ctx.beginPath();
      ctx.fillStyle = item.color;
      ctx.moveTo(180, 180);
      ctx.arc(180, 180, 180, angle, angle + sliceAngle);
      ctx.lineTo(180, 180);
      ctx.fill();

      // Linhas divisórias entre as fatias
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(180, 180);
      ctx.rotate(angle + sliceAngle / 2);
      ctx.fillStyle = item.textColor;
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.fillText(item.label, 100, 5);
      ctx.restore();
    });
  }

  function getWeightedItemIndex() {
    const rand = Math.random() * 100;
    let sum = 0;
    for (let i = 0; i < items.length; i++) {
      sum += items[i].weight;
      if (rand <= sum) return i;
    }
    return 0;
  }

  let isSpinning = false;
  let currentRotation = 0;

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('spin-btn').style.display = 'none';

    const chosenIndex = getWeightedItemIndex();
    const selectedItem = items[chosenIndex];
    const numSlices = items.length;
    const sliceAngle = 360 / numSlices;

    // Cálculo exato para o ponteiro no topo (270 graus no Canvas)
    const sliceMiddle = chosenIndex * sliceAngle + (sliceAngle / 2);
    const targetRotation = (270 - sliceMiddle + 360) % 360;
    
    // Adiciona giros completos extras
    const extraSpins = 360 * 5;
    const totalRotation = currentRotation + extraSpins + ((targetRotation - (currentRotation % 360) + 360) % 360);
    currentRotation = totalRotation;

    let start = null;
    function animate(timestamp) {
      if (!start) start = timestamp;
      const progress = (timestamp - start) / 4000;
      
      if (progress < 1) {
        const easeOut = 1 - Math.pow(1 - progress, 4);
        canvas.style.transform = `rotate(${easeOut * totalRotation}deg)`;
        requestAnimationFrame(animate);
      } else {
        canvas.style.transform = `rotate(${totalRotation}deg)`;
        document.getElementById('result').innerText = `Parabéns! Você ganhou: ${selectedItem.label}`;
        
        // Envio automático para o Google Sheets
        if (SCRIPT_URL && SCRIPT_URL !== "AKfycby20Y0vvxAA_iz5Ddw7vCXea6piV8Pap_YkHUd19pFxiYxrgkDsJMWnJ9oF1RECqhCL1Q") {
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nome: window.currentUser.nome,
              cpf: window.currentUser.cpf,
              email: window.currentUser.email,
              phone: window.currentUser.phone,
              item: selectedItem.label
            })
          }).catch(err => console.error("Erro ao enviar dados:", err));
        }

        // Bloqueio do CPF
        const playedCPFs = JSON.parse(localStorage.getItem('played_cpfs') || '[]');
        playedCPFs.push(window.currentUser.cpf);
        localStorage.setItem('played_cpfs', JSON.stringify(playedCPFs));

        setTimeout(() => {
          document.getElementById('spin-btn').style.display = 'inline-block';
          document.getElementById('result').innerText = '';
          isSpinning = false;
          showPage('page-home');
        }, 10000);
      }
    }
    requestAnimationFrame(animate);
  }
</script>
