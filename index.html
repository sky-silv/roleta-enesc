<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta ENESC-GO JOVEM</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
    
    body { 
      background: linear-gradient(135deg, #1b429b 0%, #0b2265 100%); 
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
    }
    
    .page { 
      display: none; 
      width: 100vw; 
      height: 100vh; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      position: absolute; 
      top: 0; 
      left: 0; 
    }
    
    .active { 
      display: flex; 
    }
    
    /* Tela Inicial */
    .logo { 
      max-width: 320px; 
      width: 80%; 
      height: auto; 
      margin-bottom: 35px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
    }
    
    .btn { 
      background: linear-gradient(180deg, #f8d000 0%, #e0ab00 100%); 
      color: #0b2265; 
      border: 3px solid #ffffff; 
      padding: 18px 55px; 
      font-size: 1.8rem; 
      font-weight: 800; 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
      text-transform: uppercase;
      letter-spacing: 1px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .btn:hover, .btn:active { 
      transform: scale(1.06); 
      background: linear-gradient(180deg, #ffe033 0%, #f8d000 100%);
      box-shadow: 0 12px 30px rgba(248, 208, 0, 0.5);
    }

    /* Tela da Roleta */
    .wheel-container { 
      position: relative; 
      width: 360px; 
      height: 360px; 
      max-width: 90vw;
      max-height: 90vw;
      margin-bottom: 30px; 
    }
    
    canvas { 
      width: 100%;
      height: 100%;
      border-radius: 50%; 
      border: 8px solid #f8d000; 
      box-shadow: 0 0 35px rgba(0,0,0,0.6); 
    }
    
    .arrow { 
      position: absolute; 
      top: -22px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 0; 
      height: 0; 
      border-left: 20px solid transparent; 
      border-right: 20px solid transparent; 
      border-top: 36px solid #009933; 
      filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.6));
      z-index: 10; 
    }
    
    .result-msg { 
      font-size: 2.2rem; 
      font-weight: 800; 
      text-align: center; 
      min-height: 70px; 
      color: #f8d000; 
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
      padding: 0 15px;
      margin-top: 10px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- TELA 1: INÍCIO -->
  <div id="page-home" class="page active">
    <img src="logo-enesc.jpeg" alt="Logo ENESC-GO JOVEM" class="logo" onerror="this.src='https://via.placeholder.com/320x320/0b2265/f8d000?text=ENESC-GO+JOVEM'">
    <button class="btn" onclick="goToWheel()">INICIAR</button>
  </div>

  <!-- TELA 2: ROLETA -->
  <div id="page-wheel" class="page">
    <div class="wheel-container">
      <div class="arrow"></div>
      <canvas id="wheel" width="360" height="360"></canvas>
    </div>
    <button id="spin-btn" class="btn" onclick="spinWheel()">GIRAR!</button>
    <div id="result" class="result-msg"></div>
    <button id="back-btn" class="btn-secondary" style="display: none;" onclick="goToHome()">INÍCIO</button>
  </div>

  <script>
    // Navegação de páginas
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goToWheel() {
      document.getElementById('result').innerText = '';
      document.getElementById('spin-btn').style.display = 'inline-block';
      document.getElementById('back-btn').style.display = 'none';
      showPage('page-wheel');
      drawWheel();
    }

    function goToHome() {
      showPage('page-home');
    }

    // 7 Itens na roleta com probabilidades exatamente iguais (1/7)
    const items = [
      { label: "R$ 100,00", color: "#e63946", textColor: "#ffffff" },
      { label: "Camiseta", color: "#009933", textColor: "#ffffff" },
      { label: "Chaveiro", color: "#0b2265", textColor: "#ffffff" },
      { label: "Caderneta", color: "#f8d000", textColor: "#0b2265" },
      { label: "Caneta", color: "#009933", textColor: "#ffffff" },
      { label: "Bottom", color: "#0b2265", textColor: "#ffffff" },
      { label: "Ecobag", color: "#f8d000", textColor: "#0b2265" }
    ];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    function drawWheel() {
      const numSlices = items.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      ctx.clearRect(0, 0, 360, 360);

      items.forEach((item, i) => {
        const angle = i * sliceAngle;
        ctx.beginPath();
        ctx.fillStyle = item.color;
        ctx.moveTo(180, 180);
        ctx.arc(180, 180, 180, angle, angle + sliceAngle);
        ctx.lineTo(180, 180);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(180, 180);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.fillStyle = item.textColor;
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText(item.label, 105, 5);
        ctx.restore();
      });
    }

    function getRandomItemIndex() {
      // Sorteio 100% igual e aleatório entre os 7 itens
      return Math.floor(Math.random() * items.length);
    }

    let isSpinning = false;
    let currentRotation = 0;

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spin-btn').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('result').innerText = '';

      const chosenIndex = getRandomItemIndex();
      const selectedItem = items[chosenIndex];
      const numSlices = items.length;
      const sliceAngle = 360 / numSlices;

      const sliceMiddle = chosenIndex * sliceAngle + (sliceAngle / 2);
      const targetRotation = (270 - sliceMiddle + 360) % 360;
      
      const extraSpins = 360 * 5; // 5 voltas completas
      const totalRotation = currentRotation + extraSpins + ((targetRotation - (currentRotation % 360) + 360) % 360);
      currentRotation = totalRotation;

      let start = null;
      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / 4000; // 4 segundos de rotação
        
        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 4);
          canvas.style.transform = `rotate(${easeOut * totalRotation}deg)`;
          requestAnimationFrame(animate);
        } else {
          canvas.style.transform = `rotate(${totalRotation}deg)`;
          document.getElementById('result').innerText = `Parabéns! Você ganhou: ${selectedItem.label}`;
          
          isSpinning = false;
          
          // Exibir botões para jogar novamente ou voltar ao início
          setTimeout(() => {
            document.getElementById('spin-btn').innerText = 'GIRAR NOVAMENTE';
            document.getElementById('spin-btn').style.display = 'inline-block';
            document.getElementById('back-btn').style.display = 'inline-block';
          }, 500);
        }
      }
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
